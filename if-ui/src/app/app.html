<div class="app-shell">
  @if(auth.user();as user){<header class="topbar"><a class="brand" routerLink="/collect"><span class="brand-mark">IF</span><span>灵感捕手 <small>INSPIRATION FETCH</small></span></a><nav><a routerLink="/collect" routerLinkActive="active">视频采集</a><a routerLink="/analysis" routerLinkActive="active">内容分析</a><a routerLink="/inspirations" routerLinkActive="active">灵感报告</a>@if(user.role==='admin'){<a routerLink="/users" routerLinkActive="active">用户中心</a>}</nav><div class="account"><button class="btn-gear" (click)="openSettings()" title="系统设置">⚙</button><span>{{user.username}}<small>{{user.role==='admin'?'ADMIN':'MEMBER'}}</small></span><button (click)="logout()">退出</button></div></header>}
  <main><router-outlet /></main>
  @if(settingsOpen()){<div class="settings-overlay" (click)="closeSettings()"></div><aside class="settings-panel"><button class="drawer-close" (click)="closeSettings()">×</button><h3>系统设置</h3><div class="setting-field"><label>MiMo API Key <small>灵感视频 AI 分析接口 (v2.5)</small></label><div class="key-status"><span class="status-dot" [class.configured]="apiConfigured()"></span><em>{{apiConfigured()?'已配置':'未配置'}}</em></div></div><input type="password" [ngModel]="apiKeyDraft()" (ngModelChange)="apiKeyDraft.set($event)" placeholder="填入小米 MiMo API Key"/><div class="settings-actions"><button [disabled]="saving()" (click)="saveSettings()">{{saving()?'保存中…':'保存'}}</button>@if(saveMsg()){<span class="save-msg">{{saveMsg()}}</span>}</div></aside>}
</div>
